name: Claude Code Review

# Steady-state burn reduction (#320 §5):
#   - Auto-trigger on `opened` only (was: opened + synchronize). A 10-commit PR
#     used to fire 10 model reviews; now it fires one. Re-review on demand by
#     leaving a comment containing `/review` (or `@claude review`).
#   - Skip Dependabot and `chore` PRs entirely (closes #314).

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  # MUST stay false. Concurrency cancellation happens when a run is *created*,
  # before job-level `if` filtering — so with cancel-in-progress: true, ANY
  # comment on the PR (including the review's own `gh pr comment`) spawned an
  # issue_comment run in this group and cancelled the in-flight review job.
  # Every pull_request-triggered review self-cancelled seconds after posting.
  # The superseded-review case this once guarded (re-review on push) died when
  # #320 dropped the `synchronize` trigger; queueing is always correct now.
  cancel-in-progress: false

jobs:
  claude-review:
    # Run when:
    #   - PR opened by a non-Dependabot author with a non-`chore` title, OR
    #   - a comment on a PR explicitly asks for `/review` or `@claude review`.
    if: |
      (github.event_name == 'pull_request'
        && github.event.pull_request.user.login != 'dependabot[bot]'
        && !startsWith(github.event.pull_request.title, 'chore'))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && (contains(github.event.comment.body, '/review')
            || contains(github.event.comment.body, '@claude review')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            number="${{ github.event.issue.number }}"
            sha="$(gh api "repos/${{ github.repository }}/pulls/${number}" --jq .head.sha)"
          else
            sha="${{ github.event.pull_request.head.sha }}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ steps.pr.outputs.sha }}

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1.0.193
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'metaframework-dispatch-bot'
          # REQUIRED to post inline comments, and the non-obvious one.
          # `--allowed-tools` only FILTERS already-registered MCP servers; it does
          # not register them. Without track_progress the github_inline_comment
          # server never connects, so the inline-comment tool is denied even when
          # correctly allow-listed -- the model burns turns retrying and the job
          # exits `success` having posted nothing. Diagnosed on sandy (#160/#164),
          # where the tell was `No buffered inline comments` in the log.
          track_progress: true
          # Defaults to TRUE and has documented buffering bugs; upstream's own
          # example omits it, which reads as "default is fine" but leaves the buggy
          # path on. Pinned off so an upstream default change can't reintroduce it.
          classify_inline_comments: false
          prompt: |
            Review this pull request for:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions.
            Be constructive and specific.

            Post findings that point at specific lines with
            mcp__github_inline_comment__create_inline_comment. Use `gh pr comment`
            for the overall summary, or for findings with no single line to anchor
            to. Say so in the summary if you find nothing worth flagging, so a
            silent pass is distinguishable from a broken run.
          # mcp__github_inline_comment__create_inline_comment must be listed here
          # AND registered by track_progress above -- both, or inline comments
          # silently no-op. --max-turns bounds the blast radius: a denied tool
          # otherwise retries to the turn limit, burning minutes to produce
          # nothing, and this account has exhausted its allowance two months running.
          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)" --max-turns 25'
