name: Claude Code Review

# Steady-state burn reduction (#320 §5):
#   - Auto-trigger on `opened` only (was: opened + synchronize). A 10-commit PR
#     used to fire 10 model reviews; now it fires one. Re-review on demand by
#     leaving a comment containing `/review` (or `@claude review`).
#   - Skip Dependabot and `chore` PRs entirely (closes #314).

on:
  pull_request:
    # `reopened` added by metaframework#707. `opened` alone cannot re-gate a fix-up
    # push, and neither can the documented fallback: a check-run attaches to the
    # SHA of the *event*, so an `issue_comment` (`/review`) run attaches to
    # `main`'s tip and never marks the PR head reviewed, while the `opened`
    # verdict is simply absent from a new head — which renders as green rather
    # than as unreviewed. `synchronize` stays OFF: it fires once per push, which
    # is the exact burn metaframework#320 §5 cut. `reopened` costs one review per
    # deliberate `gh pr close && gh pr reopen`, and is the only on-demand
    # trigger an agent can fire that carries the PR head (`gh run rerun` is
    # refused to the App token). Proofs, including the one saying this makes a
    # reviewed head *reachable* but not *guaranteed*, are in metaframework
    # `src/dispatch/review_gate_constraints.py`.
    types: [opened, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  # MUST stay false. Concurrency cancellation happens when a run is *created*,
  # before job-level `if` filtering — so with cancel-in-progress: true, ANY
  # comment on the PR (including the review's own `gh pr comment`) spawned an
  # issue_comment run in this group and cancelled the in-flight review job.
  # Every pull_request-triggered review self-cancelled seconds after posting.
  # The superseded-review case this once guarded (re-review on push) died when
  # #320 dropped the `synchronize` trigger; queueing is always correct now.
  cancel-in-progress: false

jobs:
  claude-review:
    # Run when:
    #   - PR opened by a non-Dependabot author with a non-`chore` title, OR
    #   - a comment on a PR explicitly asks for `/review` or `@claude review`.
    if: |
      (github.event_name == 'pull_request'
        && github.event.pull_request.user.login != 'dependabot[bot]'
        && !startsWith(github.event.pull_request.title, 'chore'))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && (contains(github.event.comment.body, '/review')
            || contains(github.event.comment.body, '@claude review')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            number="${{ github.event.issue.number }}"
            sha="$(gh api "repos/${{ github.repository }}/pulls/${number}" --jq .head.sha)"
          else
            sha="${{ github.event.pull_request.head.sha }}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ steps.pr.outputs.sha }}

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'metaframework-dispatch-bot'
          # REQUIRED to post inline comments, and the non-obvious one.
          # `--allowed-tools` only FILTERS already-registered MCP servers; it does
          # not register them. Without track_progress the github_inline_comment
          # server never connects, so the inline-comment tool is denied even when
          # correctly allow-listed -- the model burns turns retrying and the job
          # exits `success` having posted nothing. Diagnosed on sandy (#160/#164),
          # where the tell was `No buffered inline comments` in the log.
          track_progress: true
          # Defaults to TRUE and has documented buffering bugs; upstream's own
          # example omits it, which reads as "default is fine" but leaves the buggy
          # path on. Pinned off so an upstream default change can't reintroduce it.
          classify_inline_comments: false
          prompt: |
            Review this pull request for:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions.
            Be constructive and specific.

            Post findings that point at specific lines with
            mcp__github_inline_comment__create_inline_comment. Use `gh pr comment`
            for the overall summary, or for findings with no single line to anchor
            to. Say so in the summary if you find nothing worth flagging, so a
            silent pass is distinguishable from a broken run.
          # mcp__github_inline_comment__create_inline_comment must be listed here
          # AND registered by track_progress above -- both, or inline comments
          # silently no-op. --max-turns bounds the blast radius: a denied tool
          # otherwise retries to the turn limit, burning minutes to produce
          # nothing, and this account has exhausted its allowance two months running.
          #
          # --max-turns 40 is a MEASUREMENT, and it is ITGUY'S, not this repo's.
          # This file carried a byte-identical copy of the pre-fix line, so the
          # raise is prophylactic here; the numbers below are the evidence that
          # 25 is wrong, taken from itguy's streamed result JSON under that cap
          # (itguy #211, fixed in itguy PR #220):
          #
          #   run 34088207877  #212  26 turns / 10 denials  $0.49  error_max_turns
          #   run 34088470544  #212  27 turns / 10 denials         success
          #   run 34127739755  #216  32 turns /  7 denials  $0.59  success
          #   run 34171629175  #219  26 turns /  9 denials  $0.55  error_max_turns
          #   run 34171815438  #219  26 turns /  6 denials         success
          #
          # Every one is a RED check, and that is the point: three of the five
          # completed a real review and were failed anyway, by the action's
          # post-check ("reported a successful result after 32 turns, exceeding
          # the configured maximum of 25"). The cap was not protecting against
          # runaway reviews, it was discarding finished ones. 32 is the measured
          # requirement; 40 is that plus headroom, and matches the five fleet
          # repos already there (canvasoptimizer, homelab, itguy, metaframework,
          # sandy). This repo was the last one on 25.
          #
          # TodoWrite is allow-listed for fleet consistency and because it is
          # harmless -- an in-session scratchpad with no filesystem or GitHub
          # write surface. It is deliberately NOT claimed as the cause of the
          # 6-10 denials per run:
          #
          #   - The streamed log records the denial COUNT and never which tool
          #     was denied. `grep -c TodoWrite` over two full itguy run logs is 0.
          #   - Three of the five runs above ticked their checklists COMPLETELY
          #     with TodoWrite absent from this list, so "the model is denied the
          #     means to update its checklist" is refuted by the evidence set.
          #
          # So: the cap raise stands on measurement, the allow-list addition
          # stands on fleet consistency, and what is being denied 6-10 times a
          # run is still unidentified.
          #
          # Both settings are pinned by tests/test_review_workflow_config.py,
          # which is the only thing here that can fire. Measured 2026-09-28 over
          # all 14 recorded runs of this workflow, it has produced ZERO reviews:
          #
          #   11 skipped   filtered out by the `if:` above -- ten Dependabot or
          #                `chore` PRs, one issue_comment without `/review`
          #    2 success   runs 30537851656 (PR #3) and 35360053668 (PR #14),
          #                both stopped by the action's anti-tamper validation
          #                because both PRs edited this file. The second
          #                concluded `success` in 1.6 seconds.
          #    1 failure   run 30432219327 (PR #2), steps=0 ten seconds after
          #                spawn -- the runner was never provisioned.
          #
          # Two of the three greens on record are a gate that did nothing, so a
          # gate that has never run cannot regression-test its own config.
          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,TodoWrite,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)" --max-turns 40'
