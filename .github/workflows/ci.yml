name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # Third-party Actions are pinned to a full commit SHA (with a version
      # comment) so a compromised tag re-point can't run in CI. Dependabot's
      # github-actions ecosystem bumps these.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        # --frozen so CI tests exactly the lockfile the release build installs;
        # a bare `uv sync` may re-resolve and silently test a different set.
        run: uv sync --frozen --all-groups
      - name: Lint (ruff)
        run: uv run ruff check scripts/ tests/
      - name: Format check (ruff)
        run: uv run ruff format --check scripts/ tests/
      - name: Complexity gate (radon — no block below C)
        # Mirrors the pre-commit hook, which otherwise only ever runs locally.
        run: |
          out="$(uv run radon cc scripts/ -n C)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Prove jq is available
        # `tests/test_review_gate_decision.py` evaluates `.github/review-gate.jq`
        # by shelling out to jq, and `require-review.yml` depends on jq being on
        # the runner. ubuntu-latest ships it, but "ships it today" is not a
        # guarantee: this step makes its absence a one-line red instead of a
        # confusing failure 40 tests deep, and it is what
        # `tests/test_require_review_workflow.py::test_ci_proves_jq_is_available`
        # pins so the dependency cannot be dropped silently.
        run: jq --version
      - name: Run tests
        run: uv run pytest
      - name: Shellcheck the release scripts
        run: shellcheck scripts/*.sh
